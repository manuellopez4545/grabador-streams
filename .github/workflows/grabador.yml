name: Grabador de Twitch a Drive v2.1

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      canal_manual:
        description: 'Nombre del canal a grabar (déjalo vacío para usar el predeterminado)'
        required: false
        default: ''

concurrency:
  group: grabando-twitch-${{ github.event.inputs.canal_manual || 'default' }}
  cancel-in-progress: false

env:
  STREAMER_DEFAULT: "tei" # <-- TU CANAL PREDETERMINADO
  TZ: "America/Bogota"    # <-- HORA DE COLOMBIA

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 1. Chequeo ultrarrápido (¿Está en vivo?)
        id: check
        run: |
          CANAL="${{ github.event.inputs.canal_manual }}"
          if [ -z "$CANAL" ]; then CANAL="$STREAMER_DEFAULT"; fi
          # Pasar a minúsculas por seguridad
          CANAL=$(echo "$CANAL" | tr '[:upper:]' '[:lower:]')
          echo "CANAL=$CANAL" >> $GITHUB_ENV

          GQL=$(curl -s -H "Client-ID: kimne78kx3ncx6brgo4mv6wki5h1ko" \
            -X POST https://gql.twitch.tv/gql \
            -d "{\"query\":\"{user(login:\\\"$CANAL\\\"){stream{id}}}\"}" | grep -o '"stream":{"id"' || true)

          if [ -n "$GQL" ]; then
            echo "¡$CANAL está EN VIVO! Iniciando sistema..."
            echo "en_vivo=si" >> $GITHUB_OUTPUT
          else
            echo "$CANAL NO está en vivo. Apagando en 2 segundos..."
            echo "en_vivo=no" >> $GITHUB_OUTPUT
          fi

      - name: 2. Instalar herramientas
        if: steps.check.outputs.en_vivo == 'si'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone python3-pip
          pip3 install --upgrade streamlink

      - name: 3. Conectar con Google Drive
        if: steps.check.outputs.en_vivo == 'si'
        env:
          TOKEN: ${{ secrets.RCLONE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          echo "[mi_drive]" > ~/.config/rclone/rclone.conf
          echo "type = drive" >> ~/.config/rclone/rclone.conf
          echo "scope = drive" >> ~/.config/rclone/rclone.conf
          echo "token = $TOKEN" >> ~/.config/rclone/rclone.conf

      - name: 4. Grabar directo (Cierre automático al apagar stream)
        if: steps.check.outputs.en_vivo == 'si'
        run: |
          mkdir -p grabaciones
          FECHA_CARPETA=$(date +"%Y-%m-%d")
          HORA_INICIO=$(date +"%H-%M-%S")
          echo "FECHA_CARPETA=$FECHA_CARPETA" >> $GITHUB_ENV

          # Vigilante en segundo plano: SOLO sube partes anteriores cuando ya se creó la parte siguiente
          (
            while true; do
              sleep 30
              TOTAL_TS=$(ls -1 grabaciones/*.ts 2>/dev/null | wc -l)
              if [ "$TOTAL_TS" -gt 1 ]; then
                # Toma todos los archivos .ts MENOS el más reciente (que se está grabando ahora)
                for archivo in $(ls -1tr grabaciones/*.ts | head -n -1); do
                  nombre_mp4="${archivo%.ts}.mp4"
                  ffmpeg -y -i "$archivo" -c copy "$nombre_mp4" && rm "$archivo"
                  rclone move "$nombre_mp4" "mi_drive:StreamsTwitch/$CANAL/$FECHA_CARPETA/"
                done
              fi
            done
          ) &
          SUBIDOR_PID=$!

          # Grabación directa y estable: si el streamer corta, en 15 segundos se cierra solo
          timeout 18000s bash -c "streamlink https://www.twitch.tv/$CANAL best \
            --twitch-disable-ads \
            --stream-segment-timeout 15 \
            --stream-timeout 20 \
            -O | ffmpeg -i pipe:0 -c copy -f segment -segment_time 3600 -reset_timestamps 1 grabaciones/${CANAL}_${FECHA_CARPETA}_${HORA_INICIO}_Parte_%02d.ts" || true

          kill $SUBIDOR_PID 2>/dev/null || true

      - name: 5. Subir el video a Drive al terminar o cancelar
        if: always() && steps.check.outputs.en_vivo == 'si'
        run: |
          echo "Empaquetando y subiendo el video a Google Drive..."
          if [ -d "grabaciones" ]; then
            for archivo in grabaciones/*.ts; do
              [ -e "$archivo" ] || continue
              nombre_mp4="${archivo%.ts}.mp4"
              ffmpeg -y -i "$archivo" -c copy "$nombre_mp4" && rm "$archivo"
            done
            rclone move grabaciones/ "mi_drive:StreamsTwitch/$CANAL/$FECHA_CARPETA/"
            echo "¡Video subido con éxito!"
          fi

      - name: 6. Relevo automático para streams de +5 horas
        if: success() && steps.check.outputs.en_vivo == 'si'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          sleep 10
          GQL=$(curl -s -H "Client-ID: kimne78kx3ncx6brgo4mv6wki5h1ko" -X POST https://gql.twitch.tv/gql -d "{\"query\":\"{user(login:\\\"$CANAL\\\"){stream{id}}}\"}" | grep -o '"stream":{"id"' || true)
          if [ -n "$GQL" ]; then
            echo "El directo sigue activo tras 5 horas. Llamando al relevo..."
            curl -X POST -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/$REPO/actions/workflows/grabador.yml/dispatches \
              -d "{\"ref\":\"main\",\"inputs\":{\"canal_manual\":\"$CANAL\"}}"
          fi
