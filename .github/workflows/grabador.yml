name: Grabador de Twitch a Drive

on:
  schedule:
    - cron: '*/15 * * * *' # Revisa automáticamente cada 15 minutos
  workflow_dispatch: # Te permite encenderlo con un botón manual cuando quieras

concurrency:
  group: grabando-twitch
  cancel-in-progress: false # Evita que se abran 2 grabaciones al mismo tiempo

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Casi 6 horas por turno

    steps:
      - name: Instalar herramientas en la computadora de GitHub
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone python3-pip
          pip3 install streamlink

      - name: Conectar con tu Google Drive de 1TB
        env:
          TOKEN: ${{ secrets.RCLONE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          echo "[mi_drive]" > ~/.config/rclone/rclone.conf
          echo "type = drive" >> ~/.config/rclone/rclone.conf
          echo "scope = drive" >> ~/.config/rclone/rclone.conf
          echo "token = $TOKEN" >> ~/.config/rclone/rclone.conf

      - name: Verificar directo, grabar por bloques de 1h y hacer relevo
        env:
          STREAMER: "illojuan" # <-- AQUÍ PONES EL NOMBRE EXACTO DEL CANAL DE TWITCH
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Revisar si está en vivo
          if ! streamlink https://www.twitch.tv/$STREAMER best --stream-url > /dev/null 2>&1; then
            echo "El canal no está en vivo en este momento. Saliendo..."
            exit 0
          fi

          echo "¡Está en vivo! Iniciando grabación en máxima calidad..."
          mkdir -p grabaciones
          FECHA=$(date +"%Y-%m-%d_%H-%M")

          # 2. Proceso en segundo plano que sube cada bloque terminado a Drive
          (
            while true; do
              sleep 30
              # Busca partes que ya cerraron (más de 1 minuto sin modificarse) y las sube
              find grabaciones/ -name "*.mp4" -mmin +1 -exec rclone move {} mi_drive:StreamsTwitch/$STREAMER/ \;
            done
          ) &
          SUBIDOR_PID=$!

          # 3. Graba durante 5 horas (18000 segundos) dividiendo en videos de 1 hora (3600s)
          timeout 18000s bash -c "streamlink https://www.twitch.tv/$STREAMER best -O | ffmpeg -i pipe:0 -c copy -f segment -segment_time 3600 -reset_timestamps 1 grabaciones/${STREAMER}_${FECHA}_Parte_%02d.mp4" || true

          # 4. Detener el vigilante y subir el último pedazo que haya quedado
          kill $SUBIDOR_PID || true
          rclone move grabaciones/ mi_drive:StreamsTwitch/$STREAMER/

          # 5. CARRERA DE RELEVOS: Si después de 5 horas sigue en directo, llama al siguiente robot
          if streamlink https://www.twitch.tv/$STREAMER best --stream-url > /dev/null 2>&1; then
            echo "El directo sigue activo tras 5 horas. Llamando al robot de relevo..."
            curl -X POST -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/$REPO/actions/workflows/grabador.yml/dispatches \
              -d '{"ref":"main"}'
          fi
