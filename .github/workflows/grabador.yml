name: Grabador de Twitch a Drive

on:
  schedule:
    - cron: '*/15 * * * *' # Revisa automáticamente cada 15 minutos
  workflow_dispatch: # Botón manual para iniciarlo cuando quieras

concurrency:
  group: grabando-twitch
  cancel-in-progress: false

env:
  STREAMER: "illojuan" # <-- NOMBRE EXACTO DEL CANAL DE TWITCH

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Casi 6 horas por turno

    steps:
      - name: 1. Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone python3-pip
          pip3 install streamlink

      - name: 2. Conectar con tu Google Drive
        env:
          TOKEN: ${{ secrets.RCLONE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          echo "[mi_drive]" > ~/.config/rclone/rclone.conf
          echo "type = drive" >> ~/.config/rclone/rclone.conf
          echo "scope = drive" >> ~/.config/rclone/rclone.conf
          echo "token = $TOKEN" >> ~/.config/rclone/rclone.conf

      - name: 3. Grabar el directo
        run: |
          # Verificar si está en vivo
          if ! streamlink https://www.twitch.tv/$STREAMER best --stream-url > /dev/null 2>&1; then
            echo "El canal no está en vivo en este momento."
            exit 0
          fi

          echo "¡En vivo! Grabando..."
          mkdir -p grabaciones
          FECHA=$(date +"%Y-%m-%d_%H-%M")

          # Subidor en segundo plano (va subiendo bloques de 1 hora por si el stream es muy largo)
          (
            while true; do
              sleep 30
              for archivo in $(find grabaciones/ -name "*.ts" -mmin +1); do
                nombre_mp4="${archivo%.ts}.mp4"
                ffmpeg -y -i "$archivo" -c copy "$nombre_mp4" && rm "$archivo"
                rclone move "$nombre_mp4" mi_drive:StreamsTwitch/$STREAMER/
              done
            done
          ) &
          
          # Graba hasta por 5 horas en formato .ts (resistente a cortes manuales)
          timeout 18000s bash -c "streamlink https://www.twitch.tv/$STREAMER best -O | ffmpeg -i pipe:0 -c copy -f segment -segment_time 3600 -reset_timestamps 1 grabaciones/${STREAMER}_${FECHA}_Parte_%02d.ts" || true

      - name: 4. Subir video a Drive al terminar o cancelar el workflow
        if: always() # <-- ESTO HACE LA MAGIA: Se ejecuta aunque tú detengas el workflow manualmente
        run: |
          echo "Cerrando grabación y subiendo archivos restantes a Google Drive..."
          if [ -d "grabaciones" ]; then
            # Convertir cualquier pedazo .ts restante a .mp4 para que se pueda ver bien en Drive
            for archivo in grabaciones/*.ts; do
              [ -e "$archivo" ] || continue
              nombre_mp4="${archivo%.ts}.mp4"
              ffmpeg -y -i "$archivo" -c copy "$nombre_mp4" && rm "$archivo"
            done
            
            # Subir todo a tu Google Drive
            rclone move grabaciones/ mi_drive:StreamsTwitch/$STREAMER/
            echo "¡Subida completada con éxito!"
          fi

      - name: 5. Relevo automático (Solo si terminó por tiempo de 5h y no porque tú lo cancelaste)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if streamlink https://www.twitch.tv/$STREAMER best --stream-url > /dev/null 2>&1; then
            echo "El directo sigue en vivo tras 5 horas. Iniciando relevo..."
            curl -X POST -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/$REPO/actions/workflows/grabador.yml/dispatches \
              -d '{"ref":"main"}'
          fi
