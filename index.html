<script>
    const SUPABASE_URL = "https://gdbhnosrfsayyevfdjde.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkYmhub3NyZnNheXlldmZkamRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMjcwNTEsImV4cCI6MjEwNzYwMzA1MX0.zdapm_CZx_aYBrEy4bnjvogDFu7Jg0Cg0x4Cw7ZiLfY";
    
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    let videosGlobal = [];
    let resultadosAvanzados = [];
    let streamersMonitoreados = [];
    let usuarioActual = null;
    let vistaRecActual = 'list';
    let modoAuthActual = 'login';
    let videoModalActual = null;
    let timerBusquedaAdv = null;

    // Reloj del sidebar inferior
    setInterval(() => {
      const el = document.getElementById('sidebarClock');
      if (el) {
        const now = new Date();
        el.innerText = now.toISOString().replace('T', ' ').substring(0, 19);
      }
    }, 1000);

    // Reloj en tiempo real que actualiza todos los contadores de grabación activa cada segundo
    function calcularTiempoGrabacion(fechaInicioISO) {
      if (!fechaInicioISO) return '00:00:00';
      const inicio = new Date(fechaInicioISO).getTime();
      if (isNaN(inicio)) return '00:00:00';
      const diffSeg = Math.max(0, Math.floor((Date.now() - inicio) / 1000));
      const hrs = String(Math.floor(diffSeg / 3600)).padStart(2, '0');
      const mins = String(Math.floor((diffSeg % 3600) / 60)).padStart(2, '0');
      const segs = String(diffSeg % 60).padStart(2, '0');
      return `${hrs}:${mins}:${segs}`;
    }

    setInterval(() => {
      document.querySelectorAll('[data-rec-start]').forEach(el => {
        const startIso = el.getAttribute('data-rec-start');
        if (startIso) {
          el.innerHTML = `<i class="fa-solid fa-circle fa-fade me-1" style="font-size:0.55rem;"></i>LIVE ${calcularTiempoGrabacion(startIso)}`;
        }
      });
    }, 1000);

    // Sincronización automática con Supabase cada 15 segundos
    setInterval(() => {
      if (usuarioActual) cargarDatosPrivadosUsuario();
    }, 15000);

    async function inicializarApp() {
      const { data: { session } } = await db.auth.getSession();
      verificarAccesoObligatorio(session?.user || null);

      db.auth.onAuthStateChange((_event, session) => {
        verificarAccesoObligatorio(session?.user || null);
      });
    }

    async function verificarAccesoObligatorio(user) {
      usuarioActual = user;
      if (!user) {
        streamersMonitoreados = [];
        videosGlobal = [];
        cambiarVista('vista-auth');
        return;
      }

      const nombre = user.user_metadata?.full_name || user.user_metadata?.name || user.user_metadata?.preferred_username || user.user_metadata?.username || (user.email ? user.email.split('@')[0] : 'User');
      document.getElementById('userNameDisplay').innerText = nombre;
      document.getElementById('userInitial').innerText = nombre.charAt(0).toUpperCase();
      
      cambiarVista('vista-app');
      await cargarDatosPrivadosUsuario();
    }

    async function loginOAuthOIDC(proveedor) {
      const alerta = document.getElementById('alertaAuth');
      alerta.style.display = 'none';
      const opciones = { redirectTo: window.location.origin + window.location.pathname };
      if (proveedor === 'twitch') opciones.scopes = 'user:read:email';

      const { error } = await db.auth.signInWithOAuth({ provider: proveedor, options: opciones });
      if (error) {
        alerta.innerText = error.message;
        alerta.style.display = 'block';
      }
    }

    async function cargarDatosPrivadosUsuario() {
      if (!usuarioActual) return;
      try {
        const { data: stData, error: errSt } = await db
          .from('streamers_monitoreados')
          .select('*')
          .eq('user_id', usuarioActual.id)
          .order('created_at', { ascending: false });

        streamersMonitoreados = (!errSt && stData) ? stData : [];

        const misCanales = streamersMonitoreados.map(s => s.streamer.toLowerCase());
        if (misCanales.length > 0) {
          const { data: vidData, error: errVid } = await db
            .from('grabaciones')
            .select('*')
            .in('streamer', misCanales)
            .order('created_at', { ascending: false });

          videosGlobal = (!errVid && vidData) ? vidData : [];
        } else {
          videosGlobal = [];
        }
      } catch (e) {
        console.error(e);
      }
      actualizarTodoUI();
    }

    function mostrarSkeletonsBusqueda(cantidad = 6) {
      document.getElementById('advSearchingStatus').style.display = 'block';
      let html = '';
      for (let i = 0; i < cantidad; i++) {
        html += `
          <div class="col-12 col-md-6 col-xl-4">
            <div class="skeleton-card">
              <div class="skeleton-thumb mb-3"></div>
              <div class="d-flex gap-3 align-items-center">
                <div class="skeleton-avatar"></div>
                <div class="flex-grow-1">
                  <div class="skeleton-line" style="width: 85%;"></div>
                  <div class="skeleton-line" style="width: 60%;"></div>
                  <div class="skeleton-line mb-0" style="width: 35%;"></div>
                </div>
              </div>
            </div>
          </div>`;
      }
      document.getElementById('advResultsGrid').innerHTML = html;
    }

    function dispararBusquedaAvanzada() {
      clearTimeout(timerBusquedaAdv);
      mostrarSkeletonsBusqueda(6);
      timerBusquedaAdv = setTimeout(() => {
        ejecutarBusquedaGlobalSupabase();
      }, 350);
    }

    async function ejecutarBusquedaGlobalSupabase() {
      const canalQuery = (document.getElementById('advSearchInput')?.value || '').trim().toLowerCase();
      const catQuery = (document.getElementById('advCategoryInput')?.value || '').trim().toLowerCase();
      const orden = document.getElementById('advSortOrder')?.value || 'newest';

      try {
        let query = db
          .from('grabaciones')
          .select('*')
          .order('created_at', { ascending: orden === 'oldest' })
          .limit(60);

        if (canalQuery.length > 0) query = query.ilike('streamer', `%${canalQuery}%`);
        if (catQuery.length > 0) query = query.ilike('categoria', `%${catQuery}%`);

        const { data, error } = await query;
        document.getElementById('advSearchingStatus').style.display = 'none';

        if (error || !data || data.length === 0) {
          resultadosAvanzados = [];
          document.getElementById('advTotalCountText').innerText = '0 results';
          document.getElementById('advResultsGrid').innerHTML = `
            <div class="col-12 text-center text-secondary py-5">
              No recordings found${canalQuery ? ` for "${canalQuery}"` : ''}.
            </div>`;
          return;
        }

        resultadosAvanzados = data;
        document.getElementById('advTotalCountText').innerText = `${data.length} recordings found`;
        document.getElementById('advResultsGrid').innerHTML = resultadosAvanzados
          .map((v, idx) => crearTarjetaHTML(v, idx, true, 'global'))
          .join('');
      } catch (err) {
        document.getElementById('advSearchingStatus').style.display = 'none';
      }
    }

    async function agregarStreamerMonitoreado(idInput) {
      if (!usuarioActual) return cambiarVista('vista-auth');

      const inp = document.getElementById(idInput);
      const canal = inp.value.trim().toLowerCase()
        .replace('https://www.twitch.tv/', '')
        .replace('https://twitch.tv/', '')
        .replace('/', '');

      const regexTwitch = /^[a-z0-9_]{2,25}$/;
      if (!regexTwitch.test(canal)) {
        return alert('Please enter a valid Twitch username.');
      }

      if (streamersMonitoreados.length >= 5) {
        return alert('You have reached the maximum limit of 5 monitored streamers.');
      }

      // Verificar si otro usuario ya tenía a este streamer grabándose en vivo en este instante
      const { data: yaExistente } = await db
        .from('streamers_monitoreados')
        .select('avatar, grabando_ahora, inicio_grabacion')
        .eq('streamer', canal)
        .limit(1);

      const estadoPrevio = (yaExistente && yaExistente.length > 0) ? yaExistente[0] : {};

      const autor = usuarioActual.user_metadata?.username || usuarioActual.email || 'user';
      const { error } = await db.from('streamers_monitoreados').insert([{
        streamer: canal,
        agregado_por: autor,
        user_id: usuarioActual.id,
        activo: true,
        avatar: estadoPrevio.avatar || 'https://static-cdn.jtvnw.net/user-default-pictures-uv/cdd517fe-def4-11e9-948e-784f43822e80-profile_image-70x70.png',
        grabando_ahora: estadoPrevio.grabando_ahora || false,
        inicio_grabacion: estadoPrevio.inicio_grabacion || null
      }]);

      if (error) {
        alert(error.message.includes('unique') ? 'This channel is already in your monitored list.' : error.message);
      } else {
        inp.value = '';
        await cargarDatosPrivadosUsuario();
      }
    }

    async function eliminarStreamerMonitoreado(id) {
      if (!confirm('Remove this channel from your monitored list?')) return;
      await db.from('streamers_monitoreados').delete().eq('id', id).eq('user_id', usuarioActual.id);
      await cargarDatosPrivadosUsuario();
    }

    async function procesarAuthReal(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value;
      const username = document.getElementById('authUsername').value.trim();
      const alerta = document.getElementById('alertaAuth');
      alerta.className = 'alert alert-danger py-2 small';
      alerta.style.display = 'none';

      if (modoAuthActual === 'register') {
        const { data, error } = await db.auth.signUp({
          email,
          password,
          options: { data: { username: username || email.split('@')[0] } }
        });
        if (error) {
          alerta.innerText = error.message;
          alerta.style.display = 'block';
        } else if (data?.user && !data?.session) {
          alerta.className = 'alert alert-success py-2 small';
          alerta.innerText = 'Account created! Please check your email to verify your account.';
          alerta.style.display = 'block';
        }
      } else {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) {
          alerta.innerText = 'Invalid email or password.';
          alerta.style.display = 'block';
        }
      }
    }

    async function cerrarSesionReal() {
      await db.auth.signOut();
      verificarAccesoObligatorio(null);
    }

    function actualizarTodoUI() {
      document.getElementById('kpiTotal').innerText = videosGlobal.length;
      document.getElementById('kpiStreamers').innerText = `${streamersMonitoreados.length} / 5`;

      const enGrabacionCount = streamersMonitoreados.filter(s => s.grabando_ahora).length;
      const statusEl = document.querySelector('#tab-dashboard .kpi-value.text-success');
      if (statusEl) {
        statusEl.innerText = enGrabacionCount > 0 ? `${enGrabacionCount} Live Now` : 'Always On';
      }

      if (streamersMonitoreados.length === 0) {
        const emptyHtml = `
          <div class="col-12">
            <div class="p-4 rounded-3 text-center border border-secondary border-opacity-25" style="background:var(--bg-card);">
              <p class="text-secondary mb-2">No channels monitored yet.</p>
              <button class="btn-purple btn-sm" onclick="mostrarTab('tab-monitored')">Add Channel</button>
            </div>
          </div>`;
        document.getElementById('dashboardLiveBox').innerHTML = emptyHtml;
        document.getElementById('listaCanalesMonitoreados').innerHTML = emptyHtml;
      } else {
        // Tarjetas limpias sin botones Stop ni Restart (Solo contador automático en vivo y botón de eliminar)
        const cardsHtml = streamersMonitoreados.map(st => {
          const estaGrabando = Boolean(st.grabando_ahora);
          const badgeEstado = estaGrabando
            ? `<span class="badge bg-danger rounded-pill px-2 py-1" style="font-size:0.68rem;" data-rec-start="${st.inicio_grabacion || ''}"><i class="fa-solid fa-circle fa-fade me-1" style="font-size:0.55rem;"></i>LIVE ${calcularTiempoGrabacion(st.inicio_grabacion)}</span>`
            : `<span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-25 rounded-pill" style="font-size:0.65rem;">STANDBY</span>`;

          return `
            <div class="col-12 col-md-6 col-xl-4">
              <div class="vod-card p-3 d-flex align-items-center justify-content-between" style="cursor:default;">
                <div class="d-flex align-items-center gap-3">
                  <img src="${st.avatar}" class="streamer-avatar" style="width:48px; height:48px;">
                  <div>
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                      <span class="fw-bold fs-6 text-light">${st.streamer}</span>
                      ${badgeEstado}
                    </div>
                    <div class="text-secondary small mt-1">
                      ${estaGrabando ? 'Recording full stream in progress...' : 'Auto-record enabled (Waiting for live)'}
                    </div>
                  </div>
                </div>
                <button class="btn btn-sm btn-outline-danger rounded-pill px-3 ms-2" title="Remove channel" onclick="eliminarStreamerMonitoreado(${st.id})">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');

        document.getElementById('dashboardLiveBox').innerHTML = cardsHtml;
        document.getElementById('listaCanalesMonitoreados').innerHTML = cardsHtml;
      }

      document.getElementById('dashboardLatestGrid').innerHTML = videosGlobal.length
        ? videosGlobal.slice(0, 8).map((v, i) => crearTarjetaHTML(v, i, true, 'privado')).join('')
        : '<div class="col-12 text-secondary small">No recordings available yet.</div>';

      renderizarSeccionRecordings();
    }

    function crearTarjetaHTML(v, idx, mostrarDescarga, origen = 'privado') {
      const esEnVivo = v.duracion === 'LIVE' || v.drive_id === 'LIVE';
      const inicioIso = (v.url_directa && v.url_directa.startsWith('LIVE_DVR:')) ? v.url_directa.replace('LIVE_DVR:', '') : '';
      const linkDrive = (!esEnVivo && v.drive_id) ? `https://drive.google.com/file/d/${v.drive_id}/view` : (v.url_permanente || '#');
      const colClass = origen === 'global' ? 'col-12 col-md-6 col-xl-4' : 'col-12 col-sm-6 col-lg-4 col-xl-3';

      // Si está en vivo, refresca la miniatura en vivo de Twitch cada minuto
      const thumbSrc = esEnVivo
        ? `https://static-cdn.jtvnw.net/previews-ttv/live_user_${v.streamer}-640x360.jpg?t=${Math.floor(Date.now() / 60000)}`
        : (v.miniatura || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80');

      const badgeDuracionHTML = esEnVivo
        ? `<span class="badge-duration bg-danger" ${inicioIso ? `data-rec-start="${inicioIso}"` : ''}><i class="fa-solid fa-circle fa-fade me-1" style="font-size:0.55rem;"></i>LIVE ${inicioIso ? calcularTiempoGrabacion(inicioIso) : 'DVR'}</span>`
        : `<span class="badge-duration">${v.duracion || '01:00:00'}</span>`;

      return `
        <div class="${colClass}">
          <div class="vod-card" onclick="abrirModalVideo(${idx}, '${origen}')">
            <div class="vod-thumb">
              <img src="${thumbSrc}" alt="${v.titulo}">
              <span class="badge-twitch"><i class="fa-brands fa-twitch me-1"></i>Twitch</span>
              ${badgeDuracionHTML}
            </div>
            <div class="vod-info">
              <div class="d-flex gap-2 align-items-start">
                <img class="streamer-avatar" src="${v.avatar || 'https://static-cdn.jtvnw.net/user-default-pictures-uv/cdd517fe-def4-11e9-948e-784f43822e80-profile_image-70x70.png'}" alt="${v.streamer}">
                <div class="flex-grow-1 overflow-hidden">
                  <div class="vod-title">${v.titulo}</div>
                  <div class="d-flex justify-content-between align-items-center mt-1">
                    <span class="text-secondary" style="font-size:0.76rem;"><strong class="text-light">${v.streamer}</strong> • ${v.fecha}</span>
                    ${(mostrarDescarga && !esEnVivo) ? `<a href="${linkDrive}" target="_blank" onclick="event.stopPropagation()" class="text-light" title="Download MP4"><i class="fa-solid fa-download"></i></a>` : ''}
                  </div>
                  <div class="d-flex gap-1 flex-wrap mt-2">
                    <span class="badge-cat">${v.categoria || 'Just Chatting'}</span>
                    <span class="badge-res">${esEnVivo ? 'LIVE DVR (Rewind Enabled)' : (v.calidad || '1080p60')}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderizarSeccionRecordings() {
      const q = (document.getElementById('recSearchInput')?.value || '').toLowerCase();
      const sortBy = document.getElementById('recSortBy')?.value || 'recent';
      const recOrder = document.getElementById('recOrder')?.value || 'newest';
      const showDl = document.getElementById('chkDownloadBtns')?.checked ?? true;

      let filtrados = videosGlobal.filter(v =>
        v.streamer.toLowerCase().includes(q) ||
        v.titulo.toLowerCase().includes(q) ||
        v.fecha.toLowerCase().includes(q)
      );

      if (recOrder === 'oldest') filtrados.reverse();
      document.getElementById('textoContadorRec').innerText = `${filtrados.length} recordings`;

      const cont = document.getElementById('contenedorRecordingsVista');
      if (filtrados.length === 0) {
        cont.innerHTML = `<div class="text-center text-secondary py-5">No recordings found.</div>`;
        return;
      }

      if (vistaRecActual === 'grid') {
        cont.innerHTML = `<div class="row g-4">${filtrados.map(v => crearTarjetaHTML(v, videosGlobal.indexOf(v), showDl, 'privado')).join('')}</div>`;
      } else {
        const grupos = {};
        filtrados.forEach(v => {
          if (!grupos[v.streamer]) grupos[v.streamer] = [];
          grupos[v.streamer].push(v);
        });
        let nombres = Object.keys(grupos);
        if (sortBy === 'name') nombres.sort();
        if (sortBy === 'count') nombres.sort((a, b) => grupos[b].length - grupos[a].length);

        cont.innerHTML = nombres.map((st, sIdx) => {
          const vods = grupos[st];
          const avatar = vods[0]?.avatar || 'https://static-cdn.jtvnw.net/user-default-pictures-uv/cdd517fe-def4-11e9-948e-784f43822e80-profile_image-70x70.png';
          return `
            <div class="streamer-accordion">
              <div class="streamer-row" onclick="document.getElementById('drawer-${sIdx}').classList.toggle('abierto')">
                <div class="d-flex align-items-center gap-3">
                  <i class="fa-brands fa-twitch fs-5" style="color:#9146ff"></i>
                  <img src="${avatar}" class="streamer-avatar">
                  <span class="fw-bold fs-6">${st}</span>
                  <span class="badge rounded-pill bg-primary px-2">${vods.length}</span>
                </div>
                <i class="fa-solid fa-chevron-down text-secondary"></i>
              </div>
              <div id="drawer-${sIdx}" class="streamer-drawer ${sIdx === 0 ? 'abierto' : ''}">
                <div class="row g-4">${vods.map(v => crearTarjetaHTML(v, videosGlobal.indexOf(v), showDl, 'privado')).join('')}</div>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    function cambiarModoVistaRec(modo) {
      vistaRecActual = modo;
      document.getElementById('btnViewGrid').className = modo === 'grid' ? 'btn btn-sm btn-purple px-3' : 'btn btn-sm btn-outline-secondary px-3';
      document.getElementById('btnViewList').className = modo === 'list' ? 'btn btn-sm btn-purple px-3' : 'btn btn-sm btn-outline-secondary px-3';
      renderizarSeccionRecordings();
    }

    function cambiarVista(id) {
      document.querySelectorAll('.vista-seccion').forEach(el => el.classList.remove('activa'));
      document.getElementById(id).classList.add('activa');
      window.scrollTo(0, 0);
    }

    function mostrarTab(id) {
      if (!usuarioActual) return cambiarVista('vista-auth');
      document.querySelectorAll('.sub-tab').forEach(el => el.style.display = 'none');
      document.getElementById(id).style.display = 'block';
      document.querySelectorAll('.nav-item-side').forEach(el => el.classList.remove('active'));
      if (id === 'tab-dashboard') document.getElementById('menu-dashboard').classList.add('active');
      if (id === 'tab-recordings') document.getElementById('menu-recordings').classList.add('active');
      if (id === 'tab-advanced') {
        document.getElementById('menu-advanced').classList.add('active');
        document.getElementById('advSearchInput').focus();
        if (resultadosAvanzados.length === 0) dispararBusquedaAvanzada();
      }
      if (id === 'tab-monitored') document.getElementById('menu-monitored').classList.add('active');
    }

    function modoAuth(modo) {
      modoAuthActual = modo;
      const esReg = modo === 'register';
      document.getElementById('authTitulo').innerText = esReg ? 'Sign up to Streamrecorder' : 'Sign in to Streamrecorder';
      document.getElementById('authSubtitulo').innerText = esReg
        ? 'Create an account for free and enjoy full access to our features.'
        : 'Welcome back! Log in to your account to manage your monitored streams and recordings.';
      document.getElementById('campoUsernameReg').style.display = esReg ? 'block' : 'none';
      document.getElementById('btnSubmitAuth').innerText = esReg ? 'Create Account' : 'Login';
      document.getElementById('btnToggleAuth').innerText = esReg ? 'Login' : 'Create New Account';
    }

    function alternarModoAuth() { modoAuth(modoAuthActual === 'login' ? 'register' : 'login'); }
    function togglePassword() {
      const inp = document.getElementById('authPass');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    // Reproductor Híbrido: Soporta DVR en Simultáneo (con barra para atrasar el directo) y VOD Finalizado
    async function abrirModalVideo(idx, origen = 'privado') {
      const lista = origen === 'global' ? resultadosAvanzados : videosGlobal;
      const v = lista[idx];
      if (!v) return;
      videoModalActual = v;

      const esEnVivo = v.duracion === 'LIVE' || v.drive_id === 'LIVE';
      document.getElementById('modalTitulo').innerText = esEnVivo ? `🔴 LIVE DVR: ${v.titulo}` : v.titulo;
      document.getElementById('modalMeta').innerText = `${v.streamer} • ${v.fecha}`;

      const btnDescarga = document.getElementById('modalBotonDrive');
      const grupoServidores = document.getElementById('selectorServidorGroup');

      if (esEnVivo) {
        btnDescarga.style.display = 'none';
        grupoServidores.style.display = 'inline-flex';
        grupoServidores.innerHTML = `
          <button type="button" class="btn btn-outline-light btn-sm" onclick="cambiarModoDVRVivo('rewind')">
            <i class="fa-solid fa-clock-rotate-left me-1"></i>DVR Rewind (Seek Bar)
          </button>
          <button type="button" class="btn btn-outline-danger btn-sm" onclick="cambiarModoDVRVivo('live')">
            <i class="fa-solid fa-tower-broadcast me-1"></i>Real-Time Live
          </button>`;
        new bootstrap.Modal(document.getElementById('reproductorModal')).show();
        await cambiarModoDVRVivo('rewind');
      } else {
        btnDescarga.style.display = 'inline-block';
        const linkDrive = v.drive_id ? `https://drive.google.com/file/d/${v.drive_id}/view` : (v.url_directa || '#');
        btnDescarga.href = linkDrive;

        const tieneAmbos = v.drive_id && v.url_permanente && v.url_permanente.startsWith('http');
        grupoServidores.style.display = tieneAmbos ? 'inline-flex' : 'none';
        grupoServidores.innerHTML = `
          <button type="button" class="btn btn-outline-light btn-sm" onclick="cambiarServidorReproductor('drive')">Server 1</button>
          <button type="button" class="btn btn-outline-light btn-sm" onclick="cambiarServidorReproductor('archive')">Server 2</button>`;

        if (v.drive_id) {
          cambiarServidorReproductor('drive');
        } else if (v.url_permanente) {
          cambiarServidorReproductor('archive');
        }
        new bootstrap.Modal(document.getElementById('reproductorModal')).show();
      }
    }

    // Permite atrasar el directo en curso desde el minuto 00:00 o ver la señal en vivo
    async function cambiarModoDVRVivo(modo) {
      const v = videoModalActual;
      if (!v) return;
      const iframeCont = document.getElementById('contenedorIframe');
      const parentHost = window.location.hostname || 'localhost';

      if (modo === 'rewind') {
        try {
          // Consulta el ID del buffer de transmisión actual para habilitar la barra de retroceso (DVR Seek Bar)
          const resp = await fetch('https://gql.twitch.tv/gql', {
            method: 'POST',
            headers: { 'Client-ID': 'kimne78kx3ncx6brgo4mv6wki5h1ko', 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query: `{ user(login: "${v.streamer}") { videos(first: 1, type: ARCHIVE) { edges { node { id } } } } }`
            })
          });
          const json = await resp.json();
          const activeVodId = json?.data?.user?.videos?.edges?.[0]?.node?.id;

          if (activeVodId) {
            iframeCont.innerHTML = `<iframe src="https://player.twitch.tv/?video=${activeVodId}&parent=${parentHost}&autoplay=true" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
            return;
          }
        } catch (e) {}
      }

      // Si el streamer tiene desactivados los archivos en Twitch o el usuario elige Real-Time Live, muestra la señal en directo
      iframeCont.innerHTML = `<iframe src="https://player.twitch.tv/?channel=${v.streamer}&parent=${parentHost}&autoplay=true" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
    }

    function cambiarServidorReproductor(servidor) {
      const v = videoModalActual;
      if (!v) return;
      const iframeCont = document.getElementById('contenedorIframe');
      if (servidor === 'drive' && v.drive_id) {
        iframeCont.innerHTML = `<iframe src="https://drive.google.com/file/d/${v.drive_id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
      } else if (v.url_permanente) {
        iframeCont.innerHTML = `<video controls autoplay style="width:100%; height:100%; background:#000;"><source src="${v.url_permanente}" type="video/mp4"></video>`;
      }
    }

    document.getElementById('reproductorModal').addEventListener('hidden.bs.modal', () => {
      document.getElementById('contenedorIframe').innerHTML = '';
    });

    inicializarApp();
  </script>
