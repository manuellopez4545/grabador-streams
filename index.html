<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamRecorder</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0b0c14;
      --bg-sidebar: #0f101a;
      --bg-card: #151726;
      --bg-card-hover: #1c1f33;
      --bg-input: #17192b;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --text-muted: #8b90b2;
      --border-color: rgba(255, 255, 255, 0.06);
    }
    body {
      font-family: 'Lexend', sans-serif;
      background-color: var(--bg-dark);
      color: #fff;
      margin: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .vista-seccion { display: none; min-height: 100vh; }
    .vista-seccion.activa { display: block; }

    /* Botones */
    .btn-purple {
      background: linear-gradient(135deg, #6c5ce7, #8e44ad);
      border: none;
      color: #fff;
      border-radius: 50px;
      padding: 0.6rem 1.4rem;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .btn-purple:hover { opacity: 0.92; transform: translateY(-1px); color: #fff; }
    .btn-outline-purple {
      background: transparent;
      border: 1.5px solid var(--accent);
      color: #fff;
      border-radius: 50px;
      padding: 0.6rem 1.4rem;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .btn-outline-purple:hover { background: rgba(108, 92, 231, 0.14); color: #fff; }

    /* Auth Layout */
    .auth-wrapper { display: flex; min-height: 100vh; }
    .auth-left {
      flex: 1;
      max-width: 540px;
      padding: 3rem 3.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--bg-dark);
    }
    @media (max-width: 576px) { .auth-left { padding: 2rem 1.5rem; } }
    .auth-right {
      flex: 1;
      background: linear-gradient(135deg, rgba(11, 12, 20, 0.72), rgba(108, 92, 231, 0.22)),
                  url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1600&q=80') center/cover;
      display: none;
    }
    @media (min-width: 992px) { .auth-right { display: block; } }

    .brand-logo {
      font-weight: 700;
      font-size: 1.3rem;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.85rem;
    }
    .auth-input {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 50px;
      padding: 0.78rem 1.3rem;
      width: 100%;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .auth-input:focus { border-color: var(--accent); }
    .oauth-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 50px;
      padding: 0.68rem;
      width: 100%;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      font-weight: 500;
    }
    .oauth-btn:hover { background: var(--bg-card-hover); border-color: rgba(255,255,255,0.18); }
    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin: 1.4rem 0;
    }
    .divider-text::before, .divider-text::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }
    .divider-text:not(:empty)::before { margin-right: .85em; }
    .divider-text:not(:empty)::after { margin-left: .85em; }

    /* App Layout */
    .app-header {
      height: 68px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.75rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-search {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 50px;
      padding: 0.35rem 0.45rem 0.35rem 1.1rem;
      width: 420px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .header-search:focus-within { border-color: var(--accent); }
    .header-search input {
      background: transparent;
      border: none;
      color: #fff;
      width: 100%;
      outline: none;
      font-size: 0.85rem;
    }
    .app-body { display: flex; min-height: calc(100vh - 68px); }
    .app-sidebar {
      width: 240px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      padding: 1.5rem 0.9rem;
      flex-shrink: 0;
    }
    .nav-item-side {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.75rem 1rem;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-item-side:hover, .nav-item-side.active {
      background: rgba(108, 92, 231, 0.15);
      color: #fff;
    }
    .nav-item-side.active i { color: var(--accent-light); }
    .app-content { flex: 1; padding: 2rem; max-width: 1600px; }

    /* KPI Cards */
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem 1.4rem;
    }
    .kpi-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .kpi-value {
      font-size: 1.75rem;
      font-weight: 700;
      margin-top: 4px;
    }

    /* VOD Cards */
    .vod-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.22s ease;
      cursor: pointer;
      height: 100%;
    }
    .vod-card:hover {
      transform: translateY(-4px);
      background: var(--bg-card-hover);
      border-color: rgba(108, 92, 231, 0.5);
    }
    .vod-thumb {
      position: relative;
      aspect-ratio: 16/9;
      background: #000;
      overflow: hidden;
    }
    .vod-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .badge-twitch {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #9146ff;
      color: #fff;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 5px;
      font-weight: 600;
    }
    .badge-duration {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-size: 0.74rem;
      padding: 2px 7px;
      border-radius: 4px
